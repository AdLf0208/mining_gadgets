[package]
# Port of Mining Gadgets 1.18.8 (Direwolf20-MC/MiningGadgets, MIT) to Horizon 26.3 at the
# pin in horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md);
# local-only until publishing is approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "mininggadgets"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Mining Gadgets for Horizon, slice 1: the laser and its FE"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command
# (the launcher builds against its own copy of the same build). Any other registry dependency
# must be pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
